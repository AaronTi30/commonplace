[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commonplace-api"
version = "0.0.0"
description = "FastAPI backend for commonplace."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "ebooklib>=0.18",
  "fastapi>=0.110",
  "httpx>=0.27",
  "pgvector>=0.3.6",
  "psycopg[binary]>=3.1",
  "pymupdf>=1.24",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "sentence-transformers>=3.0",
  "sqlalchemy>=2.0",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Local `alembic/` (migration scripts) sits next to `app/`; setuptools would treat both as
# top-level packages and refuse the build. Only discover our application package.
[tool.setuptools.packages.find]
where = ["."]
include = ["app"]
exclude = ["alembic*", "tests*"]

